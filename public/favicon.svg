<!-- Hand-drawn on a 16px grid. Do not regenerate by scaling the 64u master; it
     antialiases into a gray slab. Scale only by whole multiples of 16.
     Fill is selected on `svg`, never `rect`: SVGO merges the rects into one
     path, and fill inherits, so a root rule survives that. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" role="img" aria-label="duplexsystem"><style>svg{fill:#b48cff}@media(prefers-color-scheme:light){svg{fill:#6d3fd1}}</style><rect x="1" y="5" width="14" height="2"/><rect x="2" y="3" width="2" height="2"/><rect x="4" y="2" width="2" height="2"/><rect x="6" y="1" width="2" height="2"/><rect x="1" y="9" width="14" height="2"/><rect x="12" y="11" width="2" height="2"/><rect x="10" y="12" width="2" height="2"/><rect x="8" y="13" width="2" height="2"/></svg>
