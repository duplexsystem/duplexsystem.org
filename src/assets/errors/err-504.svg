<svg xmlns="http://www.w3.org/2000/svg" aria-label="A blocky server rack matching 500, 502 and 503, with a gateway clock whose hand sweeps round and then stops" class="e504" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes e504-led{0%,65%{opacity:1}45%{opacity:.25}}@keyframes e504-h1{0%,25%,31%,50%,56%,6%,75%{opacity:1}24%,32%,49%,57%,7%,74%{opacity:0}}@keyframes e504-h2{12%,32%,37%,57%,62%,7%{opacity:1}0%,13%,31%,38%,56%,6%,63%{opacity:0}}@keyframes e504-h3{13%,18%,38%,43%,63%,68%{opacity:1}0%,12%,19%,37%,44%,62%,69%{opacity:0}}@keyframes e504-h4{19%,24%,44%,49%,69%,74%{opacity:1}0%,18%,25%,43%,50%,68%,75%{opacity:0}}.e504{fill:currentColor;shape-rendering:crispEdges}.e504__led{animation:e504-led 2.4s steps(1,end) infinite}.e504__h1{animation:e504-h1 8s steps(1,end) infinite}.e504__h2{animation:e504-h2 8s steps(1,end) infinite}.e504__h3{animation:e504-h3 8s steps(1,end) infinite}.e504__h4{animation:e504-h4 8s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.e504__h1,.e504__led{animation:none;opacity:1}.e504__h2,.e504__h3,.e504__h4{animation:none;opacity:0}}</style><g class="e504__rack"><rect width="12" height="1" x="10" y="10"/><rect width="1" height="11" x="10" y="11"/><rect width="1" height="11" x="21" y="11"/><rect width="12" height="1" x="10" y="14"/><rect width="12" height="1" x="10" y="18"/><rect width="12" height="1" x="10" y="22"/><rect width="4" height="1" x="16" y="12"/><rect width="4" height="1" x="16" y="16"/><rect width="4" height="1" x="16" y="20"/><rect width="2" height="1" x="11" y="23"/><rect width="2" height="1" x="19" y="23"/></g><g class="e504__led"><rect width="1" height="1" x="12" y="12"/><rect width="1" height="1" x="14" y="12"/><rect width="1" height="1" x="12" y="16"/><rect width="1" height="1" x="14" y="16"/><rect width="1" height="1" x="12" y="20"/><rect width="1" height="1" x="14" y="20"/></g><g class="e504__clock_frame"><rect width="3" height="1" x="4" y="12"/><rect width="1" height="3" x="