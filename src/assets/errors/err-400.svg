<svg class="e400" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky speech bubble whose lines of text keep scrambling into noise, with loose pixels shedding off it and a large question mark waiting beside it" style="color:var(--acc, #b48cff)">
  <style>
    .e400 { fill: currentColor; shape-rendering: crispEdges; }

    /* Three drawn states swapped by steps(1, end); never cross-faded, or the
       glyphs dissolve and read as a rendering fault. */
    .e400__msg--a { animation: e400-msg-a 2.4s steps(1, end) infinite; }
    .e400__msg--b { animation: e400-msg-b 2.4s steps(1, end) infinite; }
    .e400__msg--c { animation: e400-msg-c 2.4s steps(1, end) infinite; }
    @keyframes e400-msg-a { 0%, 38% { opacity: 1 } 38%, 50% { opacity: 0 } 50%, 84% { opacity: 1 } 84%, 92% { opacity: 0 } 92%, 100% { opacity: 1 } }
    @keyframes e400-msg-b { 0%, 38% { opacity: 0 } 38%, 42% { opacity: 1 } 42%, 46% { opacity: 0 } 46%, 50% { opacity: 1 } 50%, 88% { opacity: 0 } 88%, 92% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes e400-msg-c { 0%, 42% { opacity: 0 } 42%, 46% { opacity: 1 } 46%, 84% { opacity: 0 } 84%, 88% { opacity: 1 } 88%, 100% { opacity: 0 } }

    .e400__q { animation: e400-q 2.4s steps(1, end) infinite; }
    @keyframes e400-q { 0%, 38% { opacity: 0.35 } 38%, 50% { opacity: 1 } 50%, 84% { opacity: 0.35 } 84%, 92% { opacity: 1 } 92%, 100% { opacity: 0.35 } }

    /* Loose pixels. Whole-pixel steps only, and every stop restates both
       properties: anything else interpolates and smears a 1px square. */
    .e400__bit--u { animation: e400-bit-u 2.9s steps(1, end) infinite; }
    .e400__bit--d { animation: e400-bit-d 3.7s steps(1, end) infinite; }
    @keyframes e400-bit-u {
      0%   { transform: translate(0, 0);      opacity: 1 }
      22%  { transform: translate(0, -1px);   opacity: 1 }
      44%  { transform: translate(1px, -2px); opacity: 1 }
      66%  { transform: translate(1px, -3px); opacity: 0 }
      100% { transform: translate(1px, -3px); opacity: 0 }
    }
    @keyframes e400-bit-d {
      0%   { transform: translate(0, 0);      opacity: 0 }
      20%  { transform: translate(0, 1px);    opacity: 1 }
      40%  { transform: translate(1px, 2px);  opacity: 1 }
      60%  { transform: translate(1px, 3px);  opacity: 1 }
      80%  { transform: translate(2px, 4px);  opacity: 0 }
      100% { transform: translate(2px, 4px);  opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .e400__msg--a { animation: none; opacity: 1 }
      .e400__msg--b,
      .e400__msg--c { animation: none; opacity: 0 }
      .e400__q      { animation: none; opacity: 1 }
      .e400__bit--u,
      .e400__bit--d { animation: none; opacity: 1; transform: none }
    }
  </style>

  <g class="e400__bubble">
    <rect x="2" y="2" width="13" height="1"/>
    <rect x="1" y="3" width="1" height="12"/>
    <rect x="15" y="3" width="1" height="12"/>
    <rect x="2" y="15" width="2" height="1"/>
    <rect x="7" y="15" width="8" height="1"/>
    <rect x="3" y="16" width="1" height="1"/>
    <rect x="6" y="16" width="1" height="1"/>
    <rect x="2" y="17" width="1" height="1"/>
    <rect x="5" y="17" width="1" height="1"/>
    <rect x="2" y="18" width="3" height="1"/>
  </g>

  <g class="e400__msg--a">
    <rect x="3" y="5" width="3" height="1"/>
    <rect x="7" y="5" width="2" height="1"/>
    <rect x="10" y="5" width="4" height="1"/>
    <rect x="3" y="8" width="2" height="1"/>
    <rect x="6" y="8" width="5" height="1"/>
    <rect x="12" y="8" width="2" height="1"/>
    <rect x="3" y="11" width="4" height="1"/>
    <rect x="8" y="11" width="1" height="1"/>
    <rect x="10" y="11" width="3" height="1"/>
  </g>

  <g class="e400__msg--b">
    <rect x="9" y="4" width="1" height="1"/>
    <rect x="3" y="5" width="1" height="1"/>
    <rect x="5" y="5" width="4" height="1"/>
    <rect x="11" y="5" width="2" height="1"/>
    <rect x="4" y="8" width="3" height="1"/>
    <rect x="8" y="8" width="2" height="1"/>
    <rect x="11" y="8" width="3" height="1"/>
    <rect x="3" y="11" width="2" height="1"/>
    <rect x="6" y="11" width="1" height="1"/>
    <rect x="9" y="11" width="4" height="1"/>
    <rect x="4" y="12" width="1" height="1"/>
  </g>

  <g class="e400__msg--c">
    <rect x="4" y="5" width="2" height="1"/>
    <rect x="8" y="5" width="3" height="1"/>
    <rect x="13" y="5" width="1" height="1"/>
    <rect x="13" y="7" width="1" height="1"/>
    <rect x="3" y="8" width="1" height="1"/>
    <rect x="5" y="8" width="1" height="1"/>
    <rect x="7" y="8" width="5" height="1"/>
    <rect x="3" y="10" width="1" height="1"/>
    <rect x="5" y="11" width="3" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
    <rect x="11" y="11" width="3" height="1"/>
  </g>

  <g class="e400__bit--u"><rect x="17" y="4" width="1" height="1"/></g>
  <g class="e400__bit--d"><rect x="17" y="14" width="1" height="1"/></g>

  <g class="e400__q">
    <rect x="18" y="5" width="4" height="1"/>
    <rect x="17" y="6" width="2" height="1"/>
    <rect x="21" y="6" width="2" height="1"/>
    <rect x="21" y="7" width="2" height="1"/>
    <rect x="20" y="8" width="2" height="1"/>
    <rect x="19" y="9" width="2" height="1"/>
    <rect x="19" y="10" width="2" height="1"/>
    <rect x="19" y="12" width="2" height="1"/>
    <rect x="19" y="13" width="2" height="1"/>
  </g>
</svg>
