name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: system deps (brotli cli, fonttools)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q brotli
          pip install fonttools brotli
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - run: python3 scripts/test_subset_fonts.py
