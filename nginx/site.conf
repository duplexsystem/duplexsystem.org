# Shared server body: everything both the production vhost and the local
# preview serve identically. Included from inside a server block; listen,
# server_name, root and TLS stay with the environment.

brotli_static on;
gzip_static   on;
index index.html;

location = /.well-known/button { rewrite ^ $wk_button last; }

location / { try_files $uri $uri/index.html $uri.html =404; }

# Page URIs here are extensionless, so `\.html$` never matches one and pages
# would get no Cache-Control at all. add_header in a location also drops every
# server-level header, hence the repetition.
location ~ ^[^.]*$ {
    try_files $uri $uri/index.html $uri.html =404;
    add_header Vary "Accept-Encoding";
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; frame-src https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
}

location ~* \.(html|txt)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; frame-src https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
}

# Hashed filenames. CORS because @font-face is CORS-gated and other hosts
# proxy the error pages under their own origin.
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin *;
}
location /embeds/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

location /fonts/ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Access-Control-Allow-Origin *;
}
location /js/ { add_header Cache-Control "public, max-age=0, must-revalidate"; }

add_header X-Content-Type-Options nosniff;
add_header Referrer-Policy no-referrer;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; frame-src https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";

error_page 400 /errors/400/index.html;
error_page 401 /errors/401/index.html;
error_page 403 /errors/403/index.html;
error_page 404 /errors/404/index.html;
error_page 413 /errors/413/index.html;
error_page 429 /errors/429/index.html;
error_page 500 /errors/500/index.html;
error_page 502 /errors/502/index.html;
error_page 503 /errors/503/index.html;
error_page 504 /errors/504/index.html;
