brotli_static on;
gzip_static   on;
gzip_vary     on;
index index.html;
charset utf-8;
absolute_redirect off;

include /etc/nginx/dxs/headers.conf;
add_header Cache-Control "public, max-age=0, must-revalidate";

location = /.well-known/button { rewrite ^ $wk_button last; }

location = /manifest.webmanifest {
    include /etc/nginx/dxs/headers.conf;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location = /feed.json {
    include /etc/nginx/dxs/headers.conf;
    types { }
    default_type application/feed+json;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location / {
    try_files $uri $uri/index.html $uri.html =404;
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location ~ ^[^.]*[^/]$ {
    if (-d $request_filename) { return 301 $uri/$is_args$args; }
    try_files $uri $uri.html =404;
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location ~ ^[^.]*$ {
    try_files $uri $uri/index.html $uri.html =404;
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location ~* \.(html|txt)$ {
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location /_astro/ {
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin *;

    location ~* \.(?:png|gif|jpe?g|webp)$ {
        include /etc/nginx/dxs/headers.conf;
        include /etc/nginx/dxs/jxl.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location ~ \.wasm$ {
        include /etc/nginx/dxs/headers.conf;
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
location /embeds/ {
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ "^/js/.+\.[0-9a-f]{8}\.js$" {
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ "^/buttons/.+\.[0-9a-f]{8}\.[a-z]+$" {
    include /etc/nginx/dxs/headers.conf;
    include /etc/nginx/dxs/jxl.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /buttons/ {
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location ~ "^/pagefind/(fragment/|index/|.+\.[0-9a-f]{8}\.[a-z]+$|.+_[0-9a-f]{10}\.pf_meta$)" {
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /js/ {
    include /etc/nginx/dxs/headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

error_page 400 /errors/400/index.html;
error_page 401 /errors/401/index.html;
error_page 403 /errors/403/index.html;
error_page 404 /errors/404/index.html;
error_page 413 /errors/413/index.html;
error_page 429 /errors/429/index.html;
error_page 500 /errors/500/index.html;
error_page 502 /errors/502/index.html;
error_page 503 /errors/503/index.html;
error_page 504 /errors/504/index.html;
