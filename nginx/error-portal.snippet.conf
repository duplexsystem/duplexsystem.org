# duplexsystem.org error portal. Drop into any nginx vhost's `server` block:
#
#   include /etc/nginx/snippets/error-portal.snippet.conf;
#
# The client keeps this service's URL and status code; only the body comes from
# the portal. `error_page` without `=` is what preserves the status.
#
# The pages carry <base href="https://duplexsystem.org/">, so do not attach a
# CSP here that blocks style-src or font-src from that origin, or they render
# bare. The pages ship no JavaScript.
#
# If the portal is unreachable, nginx falls back to its own built-in page.
#
# proxy_intercept_errors is left out: add it next to the include if a backend's
# own error responses should be replaced too.

error_page 400 /_eportal/400;
error_page 401 /_eportal/401;
error_page 403 /_eportal/403;
error_page 404 /_eportal/404;
error_page 413 /_eportal/413;
error_page 429 /_eportal/429;
error_page 500 /_eportal/500;
error_page 502 /_eportal/502;
error_page 503 /_eportal/503;
error_page 504 /_eportal/504;

location ~ ^/_eportal/(?<eportal_code>\d+)$ {
    internal;
    # Resolved at request time, so nginx starts even when the portal is down.
    proxy_pass https://duplexsystem.org/errors/$eportal_code/index.html;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
