<svg xmlns="http://www.w3.org/2000/svg" aria-label="A blocky server rack with flames pouring out of the top and embers drifting up" class="srv" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes srv-fa{0%{opacity:1}33.3333%{opacity:0}}@keyframes srv-fb{0%,66.6667%{opacity:0}33.3333%{opacity:1}}@keyframes srv-fc{0%{opacity:0}66.6667%{opacity:1}}@keyframes srv-el{0%{transform:translateY(0);opacity:1}20%{transform:translateY(-1px);opacity:1}40%{transform:translateY(-2px);opacity:1}60%{transform:translateY(-3px);opacity:0}}@keyframes srv-er{0%{transform:translateY(0);opacity:0}25%{transform:translateY(-1px);opacity:1}50%{transform:translateY(-2px);opacity:1}75%{transform:translateY(-4px);opacity:1}90%{transform:translateY(-5px);opacity:0}}@keyframes srv-led{0%,78%{opacity:1}55%{opacity:.25}}.srv{fill:currentColor;shape-rendering:crispEdges}.srv__fire--a{animation:srv-fa .6s steps(1,end) infinite}.srv__fire--b{animation:srv-fb .6s steps(1,end) infinite}.srv__fire--c{animation:srv-fc .6s steps(1,end) infinite}.srv__ember--l{animation:srv-el 2.2s steps(1,end) infinite}.srv__ember--r{animation:srv-er 2.9s steps(1,end) infinite}.srv__led{animation:srv-led 1.9s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.srv__fire--a{animation:none;opacity:1}.srv__fire--b,.srv__fire--c{animation:none;opacity:0}.srv__ember--l,.srv__ember--r,.srv__led{animation:none;opacity:1}}</style><g class="srv__fire--a"><rect width="12" height="1" x="6" y="9"/><rect width="12" height="1" x="6" y="8"/><rect width="10" height="1" x="7" y="7"/><rect width="6" height="1" x="7" y="6"/><rect width="3" height="1" x="14" y="6"/><rect width="4" height="1" x="8" y="5"/><rect width="2" height="1" x="14" y="5"/><rect width="3" height="1" x="8" y="4"/><rect width="1" height="1" x="14" y="4"/><rect width="2" height="1" x="9" y="3"/><rect width="1" height="1" x="9" y="2"/></g><g class="srv__fire--b"><rect width="12" height="1" x="6" y="9"/><rect width="11" height="1" x="6" y="8"/><rect width="9" height="1" x="7" y="7"/><rect width="5" height="1" x="8" y="6"/><rect width="2" height="1" x="14" y="6"/><rect width="4" height="1" x="9" y="5"/><rect width="1" height="1" x="14" y="5"/><rect width="3" height="1" x="10" y="4"/><rect width="2" height="1" x="11" y="3"/><rect width="1" height="1" x="11" y="2"/><rect width="1" height="1" x="11" y="1"/></g><g class="srv__fire--c"><rect width="12" height="1" x="6" y="9"/><rect width="11" height="1" x="7" y="8"/><rect width="10" height="1" x="7" y="7"/><rect width="4" height="1" x="8" y="6"/><rect width="4" height="1" x="13" y="6"/><rect width="3" height="1" x="9" y="5"/><rect width="2" height="1" x="14" y="5"/><rect width="2" height="1" x="10" y="4"/><rect width="1" height="1" x="15" y="4"/><rect width="1" height="1" x="10" y="3"/></g><g class="srv__ember--l"><rect width="1" height="1" x="4" y="6"/></g><g class="srv__ember--r"><rect width="1" height="1" x="19" y="7"/></g><g class="srv__rack"><rect width="14" height="1" x="5" y="10"/><rect width="1" height="11" x="5" y="11"/><rect width="1" height="11" x="18" y="11"/><rect width="14" height="1" x="5" y="22"/><rect width="14" height="1" x="5" y="14"/><rect width="14" height="1" x="5" y="18"/><rect width="5" height="1" x="12" y="12"/><rect width="5" height="1" x="12" y="16"/><rect width="5" height="1" x="12" y="20"/><rect width="2" height="1" x="6" y="23"/><rect width="2" height="1" x="16" y="23"/></g><g class="srv__led"><rect width="1" height="1" x="7" y="12"/><rect width="1" height="1" x="9" y="12"/><rect width="1" height="1" x="7" y="16"/><rect width="1" height="1" x="9" y="16"/><rect width="1" height="1" x="7" y="20"/><rect width="1" height="1" x="9" y="20"/></g></svg>