<svg xmlns="http://www.w3.org/2000/svg" aria-label="A blocky padlock, with a key that floats over, tries the keyhole twice, and is turned away" class="e401" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes e401-key{0%,10%,70%{transform:translate(0,0)}18%,62%{transform:translate(-1px,2px)}26%,40%,54%{transform:translate(-2px,4px)}32%,46%{transform:translate(-3px,4px)}}@keyframes e401-lock{0%,31%,37%,45%,51%{transform:translateX(0)}32%,36%,46%,50%{transform:translateX(-1px)}}@keyframes e401-lid{0%,28%,54%{opacity:1}32%,50%{opacity:.35}}.e401{fill:currentColor;shape-rendering:crispEdges}.e401__key{animation:e401-key 6s steps(1,end) infinite}.e401__lock{animation:e401-lock 6s steps(1,end) infinite}.e401__lid{animation:e401-lid 6s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.e401__key,.e401__lid,.e401__lock{animation:none}.e401__lid{opacity:1}}</style><g class="e401__lock"><g class="e401__shackle"><rect width="3" height="1" x="5" y="3"/><rect width="1" height="1" x="4" y="4"/><rect width="1" height="1" x="8" y="4"/><rect width="1" height="5" x="3" y="5"/><rect width="1" height="5" x="9" y="5"/></g><g class="e401__body"><rect width="9" height="1" x="2" y="10"/><rect width="1" height="10" x="2" y="11"/><rect width="1" height="10" x="10" y="11"/><rect width="9" height="1" x="2" y="21"/></g><g class="e401__keyhole"><rect width="1" height="2" x="6" y="16"/><rect width="3" height="1" x="5" y="18"/><rect width="5" height="1" x="4" y="19"/></g><g class="e401__lid"><rect width="3" height="1" x="5" y="12"/><rect width="5" height="1" x="4" y="13"/><rect width="5" height="1" x="4" y="14"/><rect width="3" height="1" x="5" y="15"/></g></g><g class="e401__key"><rect width="3" height="1" x="17" y="11"/><rect width="6" height="1" x="12" y="12"/><rect width="1" height="2" x="19" y="12"/><rect width="1" height="1" x="12" y="13"/><rect width="1" height="1" x="14" y="13"/><rect width="1" height="1" x="17" y="13"/><rect width="3" height="1" x="17" y="14"/></g></svg>