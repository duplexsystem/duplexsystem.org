<svg xmlns="http://www.w3.org/2000/svg" aria-label="A blocky server rack powered down for maintenance, with sleep z's drifting up from it and a traffic cone standing beside it" class="e503" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes e503-standby{0%,80%{opacity:1}20%,60%{opacity:.55}40%{opacity:.25}}@keyframes e503-z1{0%{transform:translateY(0);opacity:1}16%{transform:translateY(-1px);opacity:1}32%{transform:translateY(-2px);opacity:1}48%{transform:translateY(-2px);opacity:0}}@keyframes e503-z2{0%{transform:translateY(0);opacity:0}24%{transform:translateY(0);opacity:1}40%{transform:translateY(-1px);opacity:1}56%{transform:translateY(-2px);opacity:1}72%{transform:translateY(-2px);opacity:0}}@keyframes e503-z3{0%{transform:translateY(0);opacity:0}48%{transform:translateY(0);opacity:1}64%{transform:translateY(-1px);opacity:1}80%{transform:translateY(-2px);opacity:1}96%{transform:translateY(-2px);opacity:0}}.e503{fill:currentColor;shape-rendering:crispEdges}.e503__led{opacity:.22}.e503__standby{animation:e503-standby 4.8s steps(1,end) infinite}.e503__z--1{animation:e503-z1 3.6s steps(1,end) infinite}.e503__z--2{animation:e503-z2 3.6s steps(1,end) infinite}.e503__z--3{animation:e503-z3 3.6s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.e503__standby,.e503__z--1,.e503__z--2,.e503__z--3{animation:none;opacity:1}}</style><g class="e503__z--1"><rect width="5" height="1" x="6" y="4"/><rect width="1" height="1" x="9" y="5"/><rect width="1" height="1" x="8" y="6"/><rect width="1" height="1" x="7" y="7"/><rect width="5" height="1" x="6" y="8"/></g><g class="e503__z--2"><rect width="4" height="1" x="12" y="3"/><rect width="1" height="1" x="14" y="4"/><rect width="1" height="1" x="13" y="5"/><rect width="4" height="1" x="12" y="6"/></g><g class="e503__z--3"><rect width="3" height="1" x="17" y="2"/><rect width="1" height="1" x="18" y="3"/><rect width="3" height="1" x="17" y="4"/></g><g class="e503__rack"><rect width="12" height="1" x="2" y="10"/><rect width="1" height="11" x="2" y="11"/><rect width="1" height="11" x="13" y="11"/><rect width="12" height="1" x="2" y="14"/><rect width="12" height="1" x="2" y="18"/><rect width="12" height="1" x="2" y="22"/><rect width="4" height="1" x="8" y="12"/><rect width="4" height="1" x="8" y="16"/><rect width="4" height="1" x="8" y="20"/><rect width="2" height="1" x="3" y="23"/><rect width="2" height="1" x="11" y="23"/></g><g class="e503__led"><rect width="1" height="1" x="6" y="12"/><rect width="1" height="1" x="4" y="16"/><rect width="1" height="1" x="6" y="16"/><rect width="1" height="1" x="4" y="20"/><rect width="1" height="1" x="6" y="20"/></g><g class="e503__standby"><rect width="1" height="1" x="4" y="12"/></g><g class="e503__cone"><rect width="2" height="2" x="18" y="15"/><rect width="4" height="1" x="17" y="17"/><rect width="1" height="1" x="17" y="18"/><rect width="1" height="1" x="20" y="18"/><rect width="4" height="1" x="17" y="19"/><rect width="6" height="1" x="16" y="20"/><rect width="1" height="1" x="16" y="21"/><rect width="1" height="1" x="21" y="21"/><rect width="6" height="1" x="16" y="22"/><rect width="8" height="1" x="15" y="23"/></g></svg>