<svg class="e502" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky server rack matching 500 and 503, with an unplugged cable sparking at the inlet" style="color:var(--acc, #b48cff)">
  <style>
    .e502 { fill: currentColor; shape-rendering: crispEdges; }

    /* 2.4s cycle, matching 500 and 503. The plug twitches, arcs, and throws a
       fleck off the prong. */
    .e502__led   { animation: e502-led   2.4s steps(1, end) infinite; }
    .e502__arc   { animation: e502-arc   2.4s steps(1, end) infinite; }
    .e502__plug  { animation: e502-plug  2.4s steps(1, end) infinite; }
    .e502__ember { animation: e502-ember 2.4s steps(1, end) infinite; }

    @keyframes e502-led {
      0%, 45%  { opacity: 1 }
      45%, 65% { opacity: 0.25 }
      65%, 100%{ opacity: 1 }
    }

    @keyframes e502-arc {
      0%, 20%  { opacity: 0 }
      20%, 26% { opacity: 1 }
      26%, 60% { opacity: 0 }
      60%, 66% { opacity: 1 }
      66%, 100%{ opacity: 0 }
    }

    @keyframes e502-plug {
      0%, 20%  { transform: translateX(0px) }
      20%, 26% { transform: translateX(-1px) }
      26%, 60% { transform: translateX(0px) }
      60%, 66% { transform: translateX(-1px) }
      66%, 100%{ transform: translateX(0px) }
    }

    @keyframes e502-ember {
      0%, 19%  { transform: translate(0px, 0px); opacity: 0 }
      20%      { transform: translate(0px, 0px); opacity: 1 } /* Emits at prong contact point */
      30%      { transform: translate(-1px, -1px); opacity: 1 } /* Sparks fly up and left */
      45%      { transform: translate(-2px, -3px); opacity: 1 }
      55%      { transform: translate(-2px, -4px); opacity: 0 }
      100%     { transform: translate(-2px, -4px); opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .e502__led   { animation: none; opacity: 1 }
      .e502__arc   { animation: none; opacity: 1 }
      .e502__plug  { animation: none; transform: translateX(0px) }
      .e502__ember { animation: none; opacity: 0 }
    }
  </style>

  <g class="e502__rack">
    <rect x="10" y="10" width="12" height="1"/>
    <rect x="10" y="11" width="1" height="11"/>
    <rect x="21" y="11" width="1" height="11"/>
    <rect x="10" y="14" width="12" height="1"/>
    <rect x="10" y="18" width="12" height="1"/>
    <rect x="10" y="22" width="12" height="1"/>
    <rect x="16" y="12" width="4" height="1"/>
    <rect x="16" y="16" width="4" height="1"/>
    <rect x="16" y="20" width="4" height="1"/>
    <rect x="11" y="23" width="2" height="1"/>
    <rect x="19" y="23" width="2" height="1"/>
  </g>

  <g class="e502__led">
    <rect x="12" y="12" width="1" height="1"/>
    <rect x="14" y="12" width="1" height="1"/>
    <rect x="12" y="16" width="1" height="1"/>
    <rect x="14" y="16" width="1" height="1"/>
    <rect x="12" y="20" width="1" height="1"/>
    <rect x="14" y="20" width="1" height="1"/>
  </g>

  <g class="e502__cord">
    <rect x="3" y="0" width="2" height="4"/>
    <rect x="4" y="4" width="2" height="4"/>
    <rect x="3" y="8" width="2" height="4"/>
  </g>

  <g class="e502__plug">
    <rect x="2" y="12" width="5" height="6"/>
    <rect x="7" y="13" width="2" height="1"/>
    <rect x="7" y="16" width="2" height="1"/>
  </g>

  <g class="e502__arc">
    <rect x="9" y="13" width="1" height="1"/>
    <rect x="9" y="16" width="1" height="1"/>
  </g>

  <g class="e502__ember">
    <rect x="9" y="13" width="1" height="1"/>
  </g>
</svg>
