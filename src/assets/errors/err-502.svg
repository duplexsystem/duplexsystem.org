<svg xmlns="http://www.w3.org/2000/svg" aria-label="A blocky server rack matching 500 and 503, with an unplugged cable sparking at the inlet" class="e502" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes e502-led{0%,65%{opacity:1}45%{opacity:.25}}@keyframes e502-arc{0%,26%,66%{opacity:0}20%,60%{opacity:1}}@keyframes e502-plug{0%,26%,66%{transform:translateX(0)}20%,60%{transform:translateX(-1px)}}@keyframes e502-ember{0%,19%{transform:translate(0,0);opacity:0}20%{transform:translate(0,0);opacity:1}30%{transform:translate(-1px,-1px);opacity:1}45%{transform:translate(-2px,-3px);opacity:1}55%{transform:translate(-2px,-4px);opacity:0}}.e502{fill:currentColor;shape-rendering:crispEdges}.e502__led{animation:e502-led 2.4s steps(1,end) infinite}.e502__arc{animation:e502-arc 2.4s steps(1,end) infinite}.e502__plug{animation:e502-plug 2.4s steps(1,end) infinite}.e502__ember{animation:e502-ember 2.4s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.e502__arc,.e502__led{animation:none;opacity:1}.e502__plug{animation:none;transform:translateX(0)}.e502__ember{animation:none;opacity:0}}</style><g class="e502__rack"><rect width="12" height="1" x="10" y="10"/><rect width="1" height="11" x="10" y="11"/><rect width="1" height="11" x="21" y="11"/><rect width="12" height="1" x="10" y="14"/><rect width="12" height="1" x="10" y="18"/><rect width="12" height="1" x="10" y="22"/><rect width="4" height="1" x="16" y="12"/><rect width="4" height="1" x="16" y="16"/><rect width="4" height="1" x="16" y="20"/><rect width="2" height="1" x="11" y="23"/><rect width="2" height="1" x="19" y="23"/></g><g class="e502__led"><rect width="1" height="1" x="12" y="12"/><rect width="1" height="1" x="14" y="12"/><rect width="1" height="1" x="12" y="16"/><rect width="1" height="1" x="14" y="16"/><rect width="1" height="1" x="12" y="20"/><rect width="1" height="1" x="14" y="20"/></g><g class="e502__cord"><rect width="2" height="4" x="3" y="0"/><rect width="2" height="4"