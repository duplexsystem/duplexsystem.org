<svg class="e401" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky padlock, with a key that floats over, tries the keyhole twice, and is turned away" style="color:var(--acc, #b48cff)">
  <style>
    .e401 { fill: currentColor; shape-rendering: crispEdges; }

    /* Key floats over, presses twice, is blocked, floats back. Whole-pixel
       translate steps only. */
    .e401__key  { animation: e401-key  6s steps(1, end) infinite; }
    .e401__lock { animation: e401-lock 6s steps(1, end) infinite; }
    .e401__lid  { animation: e401-lid  6s steps(1, end) infinite; }

    @keyframes e401-key {
      0%, 10%  { transform: translate(0px, 0px) }
      18%      { transform: translate(-1px, 2px) }
      26%      { transform: translate(-2px, 4px) } /* Reaches keyhole entry x=10 */
      32%      { transform: translate(-3px, 4px) } /* Presses into keyhole x=9 */
      40%      { transform: translate(-2px, 4px) }
      46%      { transform: translate(-3px, 4px) } /* Second press */
      54%      { transform: translate(-2px, 4px) }
      62%      { transform: translate(-1px, 2px) }
      70%, 100%{ transform: translate(0px, 0px) }
    }

    @keyframes e401-lock {
      0%, 31%  { transform: translateX(0px) }
      32%, 36% { transform: translateX(-1px) } /* Recoil on key push */
      37%, 45% { transform: translateX(0px) }
      46%, 50% { transform: translateX(-1px) } /* Second recoil */
      51%, 100%{ transform: translateX(0px) }
    }

    @keyframes e401-lid {
      0%, 28%  { opacity: 1 }
      32%, 50% { opacity: 0.35 } /* Keyhole darkens on key push */
      54%, 100%{ opacity: 1 }
    }

    @media (prefers-reduced-motion: reduce) {
      .e401__key,
      .e401__lock { animation: none }
      .e401__lid  { animation: none; opacity: 1 }
    }
  </style>

  <g class="e401__lock">
    <g class="e401__shackle">
      <rect x="5" y="3" width="3" height="1"/>
      <rect x="4" y="4" width="1" height="1"/>
      <rect x="8" y="4" width="1" height="1"/>
      <rect x="3" y="5" width="1" height="5"/>
      <rect x="9" y="5" width="1" height="5"/>
    </g>

    <g class="e401__body">
      <rect x="2" y="10" width="9" height="1"/>
      <rect x="2" y="11" width="1" height="10"/>
      <rect x="10" y="11" width="1" height="10"/>
      <rect x="2" y="21" width="9" height="1"/>
    </g>

    <g class="e401__keyhole">
      <rect x="6" y="16" width="1" height="2"/>
      <rect x="5" y="18" width="3" height="1"/>
      <rect x="4" y="19" width="5" height="1"/>
    </g>
    <g class="e401__lid">
      <rect x="5" y="12" width="3" height="1"/>
      <rect x="4" y="13" width="5" height="1"/>
      <rect x="4" y="14" width="5" height="1"/>
      <rect x="5" y="15" width="3" height="1"/>
    </g>
  </g>

  <g class="e401__key">
    <rect x="17" y="11" width="3" height="1"/>
    <rect x="12" y="12" width="6" height="1"/>
    <rect x="19" y="12" width="1" height="2"/>
    <rect x="12" y="13" width="1" height="1"/>
    <rect x="14" y="13" width="1" height="1"/>
    <rect x="17" y="13" width="1" height="1"/>
    <rect x="17" y="14" width="3" height="1"/>
  </g>
</svg>
