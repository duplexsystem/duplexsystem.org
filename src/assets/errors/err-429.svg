<svg xmlns="http://www.w3.org/2000/svg" aria-label="A blocky crowd of request pixels banking up behind a narrow gate, edging forward one beat at a time" class="e429" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes e429-shutter{0%,44%{opacity:1}8%{opacity:0}}@keyframes e429-pass{0%,7%,8%{opacity:1;transform:translateX(0)}18%{opacity:1;transform:translateX(3px)}30%{opacity:1;transform:translateX(6px)}45%{opacity:1;transform:translateX(9px)}60%{opacity:1;transform:translateX(12px)}75%{opacity:1;transform:translateX(15px)}90%{opacity:0;transform:translateX(18px)}}@keyframes e429-flow{0%,17%{transform:translateX(0)}18%,89%,90%{transform:translateX(3px)}}@keyframes e429-bounce{0%,60%{transform:translateX(0)}12%{transform:translateX(2px)}24%{transform:translateX(4px)}36%{transform:translateX(6px)}48%{transform:translateX(3px)}}@keyframes e429-g2{0%,14%,75%{opacity:0}15%,74%{opacity:1}}@keyframes e429-g3{0%,29%,65%{opacity:0}30%,64%{opacity:1}}@keyframes e429-g4{0%,44%,55%{opacity:0}45%,54%{opacity:1}}.e429{fill:currentColor;shape-rendering:crispEdges}.e429__shutter{animation:e429-shutter 1s steps(1,end) infinite}.e429__pass{animation:e429-pass 1s steps(1,end) infinite}.e429__flow{animation:e429-flow 1s steps(1,end) infinite}.e429__bounce{animation:e429-bounce 1.7s steps(1,end) infinite}.e429__q2{animation:e429-g2 10s steps(1,end) infinite}.e429__q3{animation:e429-g3 10s steps(1,end) infinite}.e429__q4{animation:e429-g4 10s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.e429__pass,.e429__q2,.e429__q3,.e429__q4,.e429__shutter{animation:none;opacity:1}.e429__pass{transform:translateX(9px)}.e429__bounce,.e429__flow{animation:none}.e429__flow{transform:translateX(0)}.e429__bounce{transform:translateX(4px)}}</style><g class="e429__gate"><rect width="3" height="8" x="14" y="1"/><rect width="5" height="2" x="13" y="9"/><rect width="5" height="2" x="13" y="13"/><rect width="3" height="8" x="14" y="15"/><rect width="1" height="4" x="