<svg xmlns="http://www.w3.org/2000/svg" aria-label="A pixel-art keycard touching a scanner slot, bouncing back as the scanner refuses it, and trying again" class="e403" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes e403-card{0%,10%,48%,49%{transform:translateX(-1px)}20%,41%{transform:translateX(2px)}29%,36%{transform:translateX(5px)}}@keyframes e403-scanner{0%,50%,71%{transform:translateX(0)}51%,55%,61%,65%{transform:translateX(-1px)}56%,60%,66%,70%{transform:translateX(1px)}}@keyframes e403-x{0%,35%,76%{opacity:0}36%,75%{opacity:1}}.e403{fill:currentColor;shape-rendering:crispEdges}.e403__card{animation:e403-card 3.5s steps(1,end) infinite}.e403__scanner{animation:e403-scanner 3.5s steps(1,end) infinite}.e403__x{animation:e403-x 3.5s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.e403__card,.e403__scanner{animation:none;transform:translateX(0)}.e403__x{animation:none;opacity:1}}</style><g class="e403__scanner"><rect width="7" height="1" x="15" y="5"/><rect width="1" height="12" x="15" y="6"/><rect width="1" height="12" x="21" y="6"/><rect width="7" height="1" x="15" y="18"/><rect width="5" height="1" x="16" y="10"/><g class="e403__x"><rect width="1" height="1" x="17" y="7"/><rect width="1" height="1" x="19" y="7"/><rect width="1" height="1" x="18" y="8"/><rect width="1" height="1" x="17" y="9"/><rect width="1" height="1" x="19" y="9"/></g><g class="e403__slot"><rect width="4" height="1" x="15" y="12"/><rect width="4" height="1" x="15" y="14"/></g></g><g class="e403__card"><rect width="7" height="1" x="4" y="9"/><rect width="1" height="5" x="4" y="10"/><rect width="1" height="5" x="10" y="10"/><rect width="7" height="1" x="4" y="15"/><rect width="5" height="1" x="5" y="11"/><rect width="2" height="1" x="5" y="13"/><rect width="2" height="1" x="8" y="13"/></g></svg>