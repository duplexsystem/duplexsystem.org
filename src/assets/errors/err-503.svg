<svg class="e503" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky server rack powered down for maintenance, with sleep z's drifting up from it and a traffic cone standing beside it" style="color:var(--acc, #b48cff)">
  <style>
    .e503 { fill: currentColor; shape-rendering: crispEdges; }

    .e503__led { opacity: .22; }

    .e503__standby { animation: e503-standby 4.8s steps(1, end) infinite; }
    @keyframes e503-standby {
      0%   { opacity: 1 }
      20%  { opacity: .55 }
      40%  { opacity: .25 }
      60%  { opacity: .55 }
      80%  { opacity: 1 }
      100% { opacity: 1 }
    }

    /* Three z's on one clock, each lit 24% of a turn after the last, so the wave
       travels up the diagonal. Whole-pixel rises only. */
    .e503__z--1 { animation: e503-z1 3.6s steps(1, end) infinite; }
    .e503__z--2 { animation: e503-z2 3.6s steps(1, end) infinite; }
    .e503__z--3 { animation: e503-z3 3.6s steps(1, end) infinite; }
    @keyframes e503-z1 {
      0%   { transform: translateY(0);    opacity: 1 }
      16%  { transform: translateY(-1px); opacity: 1 }
      32%  { transform: translateY(-2px); opacity: 1 }
      48%  { transform: translateY(-2px); opacity: 0 }
      100% { transform: translateY(-2px); opacity: 0 }
    }
    @keyframes e503-z2 {
      0%   { transform: translateY(0);    opacity: 0 }
      24%  { transform: translateY(0);    opacity: 1 }
      40%  { transform: translateY(-1px); opacity: 1 }
      56%  { transform: translateY(-2px); opacity: 1 }
      72%  { transform: translateY(-2px); opacity: 0 }
      100% { transform: translateY(-2px); opacity: 0 }
    }
    @keyframes e503-z3 {
      0%   { transform: translateY(0);    opacity: 0 }
      48%  { transform: translateY(0);    opacity: 1 }
      64%  { transform: translateY(-1px); opacity: 1 }
      80%  { transform: translateY(-2px); opacity: 1 }
      96%  { transform: translateY(-2px); opacity: 0 }
      100% { transform: translateY(-2px); opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .e503__standby { animation: none; opacity: 1 }
      .e503__z--1,
      .e503__z--2,
      .e503__z--3 { animation: none; opacity: 1 }
    }
  </style>

  <g class="e503__z--1">
    <rect x="6" y="4" width="5" height="1"/>
    <rect x="9" y="5" width="1" height="1"/>
    <rect x="8" y="6" width="1" height="1"/>
    <rect x="7" y="7" width="1" height="1"/>
    <rect x="6" y="8" width="5" height="1"/>
  </g>
  <g class="e503__z--2">
    <rect x="12" y="3" width="4" height="1"/>
    <rect x="14" y="4" width="1" height="1"/>
    <rect x="13" y="5" width="1" height="1"/>
    <rect x="12" y="6" width="4" height="1"/>
  </g>
  <g class="e503__z--3">
    <rect x="17" y="2" width="3" height="1"/>
    <rect x="18" y="3" width="1" height="1"/>
    <rect x="17" y="4" width="3" height="1"/>
  </g>

  <g class="e503__rack">
    <rect x="2" y="10" width="12" height="1"/>
    <rect x="2" y="11" width="1" height="11"/>
    <rect x="13" y="11" width="1" height="11"/>
    <rect x="2" y="14" width="12" height="1"/>
    <rect x="2" y="18" width="12" height="1"/>
    <rect x="2" y="22" width="12" height="1"/>
    <rect x="8" y="12" width="4" height="1"/>
    <rect x="8" y="16" width="4" height="1"/>
    <rect x="8" y="20" width="4" height="1"/>
    <rect x="3" y="23" width="2" height="1"/>
    <rect x="11" y="23" width="2" height="1"/>
  </g>
  <g class="e503__led">
    <rect x="6" y="12" width="1" height="1"/>
    <rect x="4" y="16" width="1" height="1"/>
    <rect x="6" y="16" width="1" height="1"/>
    <rect x="4" y="20" width="1" height="1"/>
    <rect x="6" y="20" width="1" height="1"/>
  </g>
  <g class="e503__standby">
    <rect x="4" y="12" width="1" height="1"/>
  </g>

  <g class="e503__cone">
    <rect x="18" y="15" width="2" height="2"/>
    <rect x="17" y="17" width="4" height="1"/>
    <rect x="17" y="18" width="1" height="1"/>
    <rect x="20" y="18" width="1" height="1"/>
    <rect x="17" y="19" width="4" height="1"/>
    <rect x="16" y="20" width="6" height="1"/>
    <rect x="16" y="21" width="1" height="1"/>
    <rect x="21" y="21" width="1" height="1"/>
    <rect x="16" y="22" width="6" height="1"/>
    <rect x="15" y="23" width="8" height="1"/>
  </g>
</svg>
