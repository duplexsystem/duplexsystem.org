<svg class="e403" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A pixel-art keycard touching a scanner slot, bouncing back as the scanner refuses it, and trying again" style="color:var(--acc, #b48cff)">
  <style>
    .e403 { fill: currentColor; shape-rendering: crispEdges; }

    /* 3.5s cycle: card glides in, bounces back as the X lights, scanner shakes
       refusal, then a short wait before it tries again. */

    .e403__card    { animation: e403-card    3.5s steps(1, end) infinite; }
    .e403__scanner { animation: e403-scanner 3.5s steps(1, end) infinite; }
    .e403__x       { animation: e403-x       3.5s steps(1, end) infinite; }

    @keyframes e403-card {
      0%, 10%  { transform: translateX(-1px) }
      20%      { transform: translateX(2px) }
      29%, 36% { transform: translateX(5px) } /* Touches scanner face at x=15 */
      41%      { transform: translateX(2px) }
      48%      { transform: translateX(-1px) }
      49%, 100%{ transform: translateX(-1px) }
    }

    @keyframes e403-scanner {
      0%, 50%  { transform: translateX(0px) }
      51%, 55% { transform: translateX(-1px) }
      56%, 60% { transform: translateX(1px) }
      61%, 65% { transform: translateX(-1px) }
      66%, 70% { transform: translateX(1px) }
      71%, 100%{ transform: translateX(0px) }
    }

    @keyframes e403-x {
      0%, 35%  { opacity: 0 }
      36%, 75% { opacity: 1 } /* X lights up on contact impact and stays lit through shake */
      76%, 100%{ opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .e403__card    { animation: none; transform: translateX(0px) }
      .e403__scanner { animation: none; transform: translateX(0px) }
      .e403__x       { animation: none; opacity: 1 }
    }
  </style>

  <g class="e403__scanner">
    <rect x="15" y="5" width="7" height="1"/>
    <rect x="15" y="6" width="1" height="12"/>
    <rect x="21" y="6" width="1" height="12"/>
    <rect x="15" y="18" width="7" height="1"/>

    <rect x="16" y="10" width="5" height="1"/>

    <g class="e403__x">
      <rect x="17" y="7" width="1" height="1"/>
      <rect x="19" y="7" width="1" height="1"/>
      <rect x="18" y="8" width="1" height="1"/>
      <rect x="17" y="9" width="1" height="1"/>
      <rect x="19" y="9" width="1" height="1"/>
    </g>

    <g class="e403__slot">
      <rect x="15" y="12" width="4" height="1"/>
      <rect x="15" y="14" width="4" height="1"/>
    </g>
  </g>

  <g class="e403__card">
    <rect x="4" y="9" width="7" height="1"/>
    <rect x="4" y="10" width="1" height="5"/>
    <rect x="10" y="10" width="1" height="5"/>
    <rect x="4" y="15" width="7" height="1"/>

    <rect x="5" y="11" width="5" height="1"/>

    <rect x="5" y="13" width="2" height="1"/>
    <rect x="8" y="13" width="2" height="1"/>
  </g>
</svg>
