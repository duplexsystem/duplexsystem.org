<svg xmlns="http://www.w3.org/2000/svg" aria-label="A blocky speech bubble whose lines of text keep scrambling into noise, with loose pixels shedding off it and a large question mark waiting beside it" class="e400" role="img" viewBox="0 0 24 24" style="color:var(--acc, #b48cff)"><style>@keyframes e400-msg-a{0%,50%,92%{opacity:1}38%,84%{opacity:0}}@keyframes e400-msg-b{0%,42%,50%,92%{opacity:0}38%,46%,88%{opacity:1}}@keyframes e400-msg-c{0%,46%,88%{opacity:0}42%,84%{opacity:1}}@keyframes e400-q{0%,50%,92%{opacity:.35}38%,84%{opacity:1}}@keyframes e400-bit-u{0%{transform:translate(0,0);opacity:1}22%{transform:translate(0,-1px);opacity:1}44%{transform:translate(1px,-2px);opacity:1}66%{transform:translate(1px,-3px);opacity:0}}@keyframes e400-bit-d{0%{transform:translate(0,0);opacity:0}20%{transform:translate(0,1px);opacity:1}40%{transform:translate(1px,2px);opacity:1}60%{transform:translate(1px,3px);opacity:1}80%{transform:translate(2px,4px);opacity:0}}.e400{fill:currentColor;shape-rendering:crispEdges}.e400__msg--a{animation:e400-msg-a 2.4s steps(1,end) infinite}.e400__msg--b{animation:e400-msg-b 2.4s steps(1,end) infinite}.e400__msg--c{animation:e400-msg-c 2.4s steps(1,end) infinite}.e400__q{animation:e400-q 2.4s steps(1,end) infinite}.e400__bit--u{animation:e400-bit-u 2.9s steps(1,end) infinite}.e400__bit--d{animation:e400-bit-d 3.7s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){.e400__msg--a{animation:none;opacity:1}.e400__msg--b,.e400__msg--c,.e400__q{animation:none;opacity:0}.e400__q{opacity:1}.e400__bit--d,.e400__bit--u{animation:none;opacity:1;transform:none}}</style><g class="e400__bubble"><rect width="13" height="1" x="2" y="2"/><rect width="1" height="12" x="1" y="3"/><rect width="1" height="12" x="15" y="3"/><rect width="2" height="1" x="2" y="15"/><rect width="8" height="1" x="7" y="15"/><rect width="1" height="1" x="3" y="16"/><rect width="1" height="1" x="6" y="16"/><rect width="1" height="1" x="2" y="17"/><rect width="1" height="1" x="5" y