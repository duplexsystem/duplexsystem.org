# /.well-known/button: image by default, JSON on request. A static host cannot
# negotiate, so both files are built and this picks one. `$http_accepts` too,
# because the spec's prose names a header that does not exist.
map "$arg_format|$http_accept$http_accepts" $wk_button {
    default                  /buttons/duplexsystem.png;
    "~^json\|"               /.well-known/button.json;
    "~\|.*application/json"  /.well-known/button.json;
}
