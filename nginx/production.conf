# Production vhost. Install as /etc/nginx/conf.d/duplexsystem.conf with the
# rest of nginx/ at /etc/nginx/dxs/. Requires ngx_brotli, without which
# brotli_static stops nginx from starting.

include /etc/nginx/dxs/maps.conf;

server {
    listen 443 ssl;
    http2 on;
    server_name duplexsystem.org;
    root /var/www/duplexsystem.org;

    include /etc/nginx/dxs/site.conf;
}
