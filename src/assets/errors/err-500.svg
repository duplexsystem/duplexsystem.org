<svg class="srv" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky server rack with flames pouring out of the top and embers drifting up" style="color:var(--acc, #b48cff)">
  <style>
    .srv { fill: currentColor; shape-rendering: crispEdges; }
    /* Three drawn flame states swapped, never cross-faded: a pixel drawing that
       dissolves into its neighbour stops looking like pixel art. */
    .srv__fire--a { animation: srv-fa .6s steps(1, end) infinite; }
    .srv__fire--b { animation: srv-fb .6s steps(1, end) infinite; }
    .srv__fire--c { animation: srv-fc .6s steps(1, end) infinite; }
    @keyframes srv-fa { 0%, 33.3333% { opacity: 1 } 33.3333%, 100% { opacity: 0 } }
    @keyframes srv-fb { 0%, 33.3333% { opacity: 0 } 33.3333%, 66.6667% { opacity: 1 } 66.6667%, 100% { opacity: 0 } }
    @keyframes srv-fc { 0%, 66.6667% { opacity: 0 } 66.6667%, 100% { opacity: 1 } }

    /* Embers rise a whole pixel at a time; sub-pixel drift smears them. Every
       stop restates both properties, or the omitted one interpolates. */
    .srv__ember--l { animation: srv-el 2.2s steps(1, end) infinite; }
    .srv__ember--r { animation: srv-er 2.9s steps(1, end) infinite; }
    @keyframes srv-el {
      0%   { transform: translateY(0);    opacity: 1 }
      20%  { transform: translateY(-1px); opacity: 1 }
      40%  { transform: translateY(-2px); opacity: 1 }
      60%  { transform: translateY(-3px); opacity: 0 }
      100% { transform: translateY(-3px); opacity: 0 }
    }
    @keyframes srv-er {
      0%   { transform: translateY(0);    opacity: 0 }
      25%  { transform: translateY(-1px); opacity: 1 }
      50%  { transform: translateY(-2px); opacity: 1 }
      75%  { transform: translateY(-4px); opacity: 1 }
      90%  { transform: translateY(-5px); opacity: 0 }
      100% { transform: translateY(-5px); opacity: 0 }
    }

    .srv__led { animation: srv-led 1.9s steps(1, end) infinite; }
    @keyframes srv-led { 0%, 55% { opacity: 1 } 55%, 78% { opacity: 0.25 } 78%, 100% { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .srv__fire--a { animation: none; opacity: 1 }
      .srv__fire--b,
      .srv__fire--c { animation: none; opacity: 0 }
      .srv__ember--l,
      .srv__ember--r { animation: none; opacity: 1 }
      .srv__led { animation: none; opacity: 1 }
    }
  </style>

  <g class="srv__fire--a">
    <rect x="6" y="9" width="12" height="1"/>
    <rect x="6" y="8" width="12" height="1"/>
    <rect x="7" y="7" width="10" height="1"/>
    <rect x="7" y="6" width="6" height="1"/>
    <rect x="14" y="6" width="3" height="1"/>
    <rect x="8" y="5" width="4" height="1"/>
    <rect x="14" y="5" width="2" height="1"/>
    <rect x="8" y="4" width="3" height="1"/>
    <rect x="14" y="4" width="1" height="1"/>
    <rect x="9" y="3" width="2" height="1"/>
    <rect x="9" y="2" width="1" height="1"/>
  </g>
  <g class="srv__fire--b">
    <rect x="6" y="9" width="12" height="1"/>
    <rect x="6" y="8" width="11" height="1"/>
    <rect x="7" y="7" width="9" height="1"/>
    <rect x="8" y="6" width="5" height="1"/>
    <rect x="14" y="6" width="2" height="1"/>
    <rect x="9" y="5" width="4" height="1"/>
    <rect x="14" y="5" width="1" height="1"/>
    <rect x="10" y="4" width="3" height="1"/>
    <rect x="11" y="3" width="2" height="1"/>
    <rect x="11" y="2" width="1" height="1"/>
    <rect x="11" y="1" width="1" height="1"/>
  </g>
  <g class="srv__fire--c">
    <rect x="6" y="9" width="12" height="1"/>
    <rect x="7" y="8" width="11" height="1"/>
    <rect x="7" y="7" width="10" height="1"/>
    <rect x="8" y="6" width="4" height="1"/>
    <rect x="13" y="6" width="4" height="1"/>
    <rect x="9" y="5" width="3" height="1"/>
    <rect x="14" y="5" width="2" height="1"/>
    <rect x="10" y="4" width="2" height="1"/>
    <rect x="15" y="4" width="1" height="1"/>
    <rect x="10" y="3" width="1" height="1"/>
  </g>

  <g class="srv__ember--l"><rect x="4" y="6" width="1" height="1"/></g>
  <g class="srv__ember--r"><rect x="19" y="7" width="1" height="1"/></g>

  <g class="srv__rack">
    <rect x="5" y="10" width="14" height="1"/>
    <rect x="5" y="11" width="1" height="11"/>
    <rect x="18" y="11" width="1" height="11"/>
    <rect x="5" y="22" width="14" height="1"/>
    <rect x="5" y="14" width="14" height="1"/>
    <rect x="5" y="18" width="14" height="1"/>
    <rect x="12" y="12" width="5" height="1"/>
    <rect x="12" y="16" width="5" height="1"/>
    <rect x="12" y="20" width="5" height="1"/>
    <rect x="6" y="23" width="2" height="1"/>
    <rect x="16" y="23" width="2" height="1"/>
  </g>
  <g class="srv__led">
    <rect x="7" y="12" width="1" height="1"/>
    <rect x="9" y="12" width="1" height="1"/>
    <rect x="7" y="16" width="1" height="1"/>
    <rect x="9" y="16" width="1" height="1"/>
    <rect x="7" y="20" width="1" height="1"/>
    <rect x="9" y="20" width="1" height="1"/>
  </g>
</svg>
