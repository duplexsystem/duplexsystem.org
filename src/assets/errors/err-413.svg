<svg class="e413" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky parcel far too big for the tiny mail slot in the door beside it, shoving against the door twice and rocking back while its lid pops open a pixel" style="color:var(--acc, #b48cff)">
  <style>
    .e413 { fill: currentColor; shape-rendering: crispEdges; }

    /* Two shoves, then a long pause: one reads as an accident, three strobes.
       Whole-pixel translates only, or the parcel smears. */
    .e413__box { animation: e413-shove 3.2s steps(1, end) infinite; }

    .e413__lid { animation: e413-lid 3.2s steps(1, end) infinite; }

    .e413__hit { animation: e413-hit 3.2s steps(1, end) infinite; }

    @keyframes e413-shove {
      0%   { transform: translateX(0) }
      4%   { transform: translateX(-1px) }
      8%   { transform: translateX(1px) }
      12%  { transform: translateX(2px) }
      20%  { transform: translateX(1px) }
      24%  { transform: translateX(0) }
      32%  { transform: translateX(-1px) }
      36%  { transform: translateX(1px) }
      40%  { transform: translateX(2px) }
      48%  { transform: translateX(1px) }
      52%  { transform: translateX(0) }
      100% { transform: translateX(0) }
    }
    @keyframes e413-lid {
      0%   { transform: translateY(0) }
      12%  { transform: translateY(-1px) }
      20%  { transform: translateY(0) }
      40%  { transform: translateY(-1px) }
      48%  { transform: translateY(0) }
      100% { transform: translateY(0) }
    }
    @keyframes e413-hit {
      0%,   12%  { opacity: 0 }
      12%,  20%  { opacity: 1 }
      20%,  40%  { opacity: 0 }
      40%,  48%  { opacity: 1 }
      48%,  100% { opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .e413__box { animation: none; transform: translateX(2px) }
      .e413__lid { animation: none; transform: translateY(-1px) }
      .e413__hit { animation: none; opacity: 1 }
    }
  </style>

  <g class="e413__door">
    <rect x="15" y="0" width="9" height="1"/>
    <rect x="15" y="1" width="1" height="22"/>
    <rect x="23" y="1" width="1" height="22"/>
    <rect x="22" y="6" width="1" height="2"/>
    <rect x="22" y="17" width="1" height="2"/>
  </g>

  <g class="e413__slot">
    <rect x="17" y="11" width="5" height="1"/>
    <rect x="17" y="12" width="1" height="1"/>
    <rect x="21" y="12" width="1" height="1"/>
    <rect x="17" y="13" width="5" height="1"/>
  </g>

  <g class="e413__hit">
    <rect x="16" y="6" width="1" height="1"/>
    <rect x="16" y="9" width="2" height="1"/>
    <rect x="16" y="16" width="2" height="1"/>
    <rect x="16" y="20" width="1" height="1"/>
  </g>

  <g class="e413__box">
    <g class="e413__lid">
      <rect x="1" y="3" width="12" height="1"/>
      <rect x="1" y="4" width="1" height="3"/>
      <rect x="12" y="4" width="1" height="3"/>
      <rect x="6" y="4" width="2" height="3"/>
    </g>
    <g class="e413__body">
      <rect x="1" y="7" width="12" height="1"/>
      <rect x="6" y="8" width="2" height="4"/>
      <rect x="1" y="8" width="1" height="14"/>
      <rect x="12" y="8" width="1" height="14"/>
      <rect x="1" y="19" width="12" height="1"/>
      <rect x="1" y="22" width="12" height="1"/>
      <rect x="3" y="13" width="6" height="1"/>
      <rect x="3" y="14" width="1" height="3"/>
      <rect x="8" y="14" width="1" height="3"/>
      <rect x="3" y="17" width="6" height="1"/>
      <rect x="4" y="15" width="3" height="1"/>
    </g>
  </g>

  <rect x="0" y="23" width="24" height="1"/>
</svg>
