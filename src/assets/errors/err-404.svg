<svg class="dead" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky face with crossed-out eyes and its tongue hanging out" style="color:var(--acc, #b48cff)">
  <style>
    .dead { fill: currentColor; shape-rendering: crispEdges; }
    /* Clip on the outer group, animation on the inner one. Both on one element
       makes the clip travel with the transform, clipping nothing. */
    .dead__tongue { animation: dead-loll 6s steps(1, end) infinite; }
    .dead__x    { animation: dead-x    7.3s steps(1, end) infinite; }
    .dead__dash { animation: dead-dash 7.3s steps(1, end) infinite; }
    /* Stops are one unit apart, computed rather than rounded: integer
       percentages give each tongue row an uneven slice and it stutters. */
    @keyframes dead-loll {
      0% { transform: translateY(0); }
      65.2174% { transform: translateY(-1px); }
      67.3913% { transform: translateY(-2px); }
      69.5652% { transform: translateY(-3px); }
      71.7391% { transform: translateY(-4px); }
      73.913% { transform: translateY(-5px); }
      89.1304% { transform: translateY(-4px); }
      91.3043% { transform: translateY(-3px); }
      93.4783% { transform: translateY(-2px); }
      95.6522% { transform: translateY(-1px); }
      97.8261% { transform: translateY(0); }
    }
    @keyframes dead-x    { 0%, 92% { opacity: 1; } 92%, 97% { opacity: 0; } 97%, 100% { opacity: 1; } }
    @keyframes dead-dash { 0%, 92% { opacity: 0; } 92%, 97% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .dead__tongue { animation: none; }
      .dead__x      { animation: none; opacity: 1; }
      .dead__dash   { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="deadMouth"><rect x="0" y="16" width="24" height="5"/></clipPath>
  </defs>
  <g class="dead__face">
    <rect x="7" y="1" width="10" height="1"/>
    <rect x="6" y="2" width="2" height="1"/>
    <rect x="16" y="2" width="2" height="1"/>
    <rect x="4" y="3" width="2" height="1"/>
    <rect x="18" y="3" width="2" height="1"/>
    <rect x="3" y="4" width="2" height="1"/>
    <rect x="19" y="4" width="2" height="1"/>
    <rect x="3" y="5" width="1" height="1"/>
    <rect x="20" y="5" width="1" height="1"/>
    <rect x="2" y="6" width="1" height="1"/>
    <rect x="21" y="6" width="1" height="1"/>
    <rect x="1" y="7" width="2" height="1"/>
    <rect x="21" y="7" width="2" height="1"/>
    <rect x="1" y="8" width="1" height="1"/>
    <rect x="22" y="8" width="1" height="1"/>
    <rect x="1" y="9" width="1" height="1"/>
    <rect x="22" y="9" width="1" height="1"/>
    <rect x="1" y="10" width="1" height="1"/>
    <rect x="22" y="10" width="1" height="1"/>
    <rect x="1" y="11" width="1" height="1"/>
    <rect x="22" y="11" width="1" height="1"/>
    <rect x="1" y="12" width="1" height="1"/>
    <rect x="22" y="12" width="1" height="1"/>
    <rect x="1" y="13" width="1" height="1"/>
    <rect x="22" y="13" width="1" height="1"/>
    <rect x="1" y="14" width="1" height="1"/>
    <rect x="22" y="14" width="1" height="1"/>
    <rect x="1" y="15" width="1" height="1"/>
    <rect x="6" y="15" width="12" height="1"/>
    <rect x="22" y="15" width="1" height="1"/>
    <rect x="1" y="16" width="2" height="1"/>
    <rect x="21" y="16" width="2" height="1"/>
    <rect x="2" y="17" width="1" height="1"/>
    <rect x="21" y="17" width="1" height="1"/>
    <rect x="3" y="18" width="1" height="1"/>
    <rect x="20" y="18" width="1" height="1"/>
    <rect x="3" y="19" width="2" height="1"/>
    <rect x="19" y="19" width="2" height="1"/>
    <rect x="4" y="20" width="2" height="1"/>
    <rect x="18" y="20" width="2" height="1"/>
    <rect x="6" y="21" width="2" height="1"/>
    <rect x="16" y="21" width="2" height="1"/>
    <rect x="7" y="22" width="10" height="1"/>
  </g>
  <g class="dead__x">
    <rect x="5" y="7" width="1" height="1"/>
    <rect x="9" y="7" width="1" height="1"/>
    <rect x="14" y="7" width="1" height="1"/>
    <rect x="18" y="7" width="1" height="1"/>
    <rect x="6" y="8" width="1" height="1"/>
    <rect x="8" y="8" width="1" height="1"/>
    <rect x="15" y="8" width="1" height="1"/>
    <rect x="17" y="8" width="1" height="1"/>
    <rect x="7" y="9" width="1" height="1"/>
    <rect x="16" y="9" width="1" height="1"/>
    <rect x="6" y="10" width="1" height="1"/>
    <rect x="8" y="10" width="1" height="1"/>
    <rect x="15" y="10" width="1" height="1"/>
    <rect x="17" y="10" width="1" height="1"/>
    <rect x="5" y="11" width="1" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
    <rect x="14" y="11" width="1" height="1"/>
    <rect x="18" y="11" width="1" height="1"/>
  </g>
  <g class="dead__dash">
    <rect x="5" y="9" width="5" height="1"/>
    <rect x="14" y="9" width="5" height="1"/>
  </g>
  <g clip-path="url(#deadMouth)">
    <g class="dead__tongue">
      <rect x="12" y="16" width="5" height="1"/>
      <rect x="12" y="17" width="5" height="1"/>
      <rect x="12" y="18" width="5" height="1"/>
      <rect x="12" y="19" width="5" height="1"/>
      <rect x="13" y="20" width="3" height="1"/>
    </g>
  </g>
</svg>
