<svg class="e429" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="A blocky crowd of request pixels banking up behind a narrow gate, edging forward one beat at a time" style="color:var(--acc, #b48cff)">
  <style>
    .e429 { fill: currentColor; shape-rendering: crispEdges; }

    /* 1s turnstile beat: the shutter opens, the front packet passes through, and
       the crowd steps 3px forward, stopping 1px short of the wall. */
    .e429__shutter { animation: e429-shutter 1s steps(1, end) infinite; }
    .e429__pass    { animation: e429-pass    1s steps(1, end) infinite; }
    .e429__flow    { animation: e429-flow    1s steps(1, end) infinite; }
    .e429__bounce  { animation: e429-bounce  1.7s steps(1, end) infinite; }

    @keyframes e429-shutter {
      0%, 8%   { opacity: 1 }
      8%, 44%  { opacity: 0 }
      44%, 100%{ opacity: 1 }
    }

    @keyframes e429-pass {
      0%, 7%   { opacity: 1; transform: translateX(0px); }  /* Sits at x=7 */
      8%       { opacity: 1; transform: translateX(0px); }  /* Shutter opens */
      18%      { opacity: 1; transform: translateX(3px); }  /* Moves to x=10 */
      30%      { opacity: 1; transform: translateX(6px); }  /* Enters throat at x=13 */
      45%      { opacity: 1; transform: translateX(9px); }  /* Passes jamb to x=16 */
      60%      { opacity: 1; transform: translateX(12px); } /* Downstream x=19 */
      75%      { opacity: 1; transform: translateX(15px); } /* Downstream x=22 */
      90%      { opacity: 0; transform: translateX(18px); } /* Off canvas x=25 */
      100%     { opacity: 0; transform: translateX(18px); }
    }

    @keyframes e429-flow {
      0%, 17%  { transform: translateX(0px); }
      18%, 89% { transform: translateX(3px); }
      90%, 100%{ transform: translateX(3px); }
    }

    @keyframes e429-bounce {
      0%   { transform: translateX(0px) }
      12%  { transform: translateX(2px) }
      24%  { transform: translateX(4px) }
      36%  { transform: translateX(6px) }
      48%  { transform: translateX(3px) }
      60%  { transform: translateX(0px) }
      100% { transform: translateX(0px) }
    }

    .e429__q2 { animation: e429-g2 10s steps(1, end) infinite; }
    .e429__q3 { animation: e429-g3 10s steps(1, end) infinite; }
    .e429__q4 { animation: e429-g4 10s steps(1, end) infinite; }

    @keyframes e429-g2 {
      0%, 14%  { opacity: 0 }
      15%, 74% { opacity: 1 }
      75%, 100%{ opacity: 0 }
    }
    @keyframes e429-g3 {
      0%, 29%  { opacity: 0 }
      30%, 64% { opacity: 1 }
      65%, 100%{ opacity: 0 }
    }
    @keyframes e429-g4 {
      0%, 44%  { opacity: 0 }
      45%, 54% { opacity: 1 }
      55%, 100%{ opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .e429__q2,
      .e429__q3,
      .e429__q4     { animation: none; opacity: 1 }
      .e429__shutter { animation: none; opacity: 1 }
      .e429__pass    { animation: none; opacity: 1; transform: translateX(9px) }
      .e429__flow    { animation: none; transform: translateX(0px) }
      .e429__bounce  { animation: none; transform: translateX(4px) }
    }
  </style>

  <g class="e429__gate">
    <rect x="14" y="1" width="3" height="8"/>
    <rect x="13" y="9" width="5" height="2"/>
    <rect x="13" y="13" width="5" height="2"/>
    <rect x="14" y="15" width="3" height="8"/>
    <rect x="13" y="5" width="1" height="4"/>
    <rect x="13" y="15" width="1" height="4"/>
  </g>

  <g class="e429__shutter"><rect x="13" y="11" width="5" height="2"/></g>

  <!-- Centre-line queue, static. Its apparent motion is the pass packet sliding
       over it; translating this row too pops the loop. -->
  <g class="e429__qmid">
    <rect x="1" y="11" width="2" height="2"/>
    <rect x="4" y="11" width="2" height="2"/>
    <rect x="7" y="11" width="2" height="2"/>
    <rect x="10" y="11" width="2" height="2"/>
  </g>

  <g class="e429__pass"><rect x="7" y="11" width="2" height="2"/></g>

  <g class="e429__bounce"><rect x="5" y="1" width="2" height="2"/></g>

  <g class="e429__flow">
    <g class="e429__q1">
      <rect x="10" y="8" width="2" height="2"/>
      <rect x="10" y="14" width="2" height="2"/>
      <rect x="10" y="5" width="2" height="2"/>
      <rect x="10" y="17" width="2" height="2"/>
      <rect x="7" y="8" width="2" height="2"/>
      <rect x="4" y="8" width="2" height="2"/>
      <rect x="7" y="14" width="2" height="2"/>
      <rect x="4" y="14" width="2" height="2"/>
    </g>

    <g class="e429__q2">
      <rect x="1" y="8" width="2" height="2"/>
      <rect x="1" y="14" width="2" height="2"/>
      <rect x="7" y="5" width="2" height="2"/>
      <rect x="7" y="17" width="2" height="2"/>
    </g>

    <g class="e429__q3">
      <rect x="-2" y="8" width="2" height="2"/>
      <rect x="-2" y="14" width="2" height="2"/>
      <rect x="4" y="5" width="2" height="2"/>
      <rect x="4" y="17" width="2" height="2"/>
    </g>

    <g class="e429__q4">
      <rect x="1" y="5" width="2" height="2"/>
      <rect x="-2" y="5" width="2" height="2"/>
      <rect x="1" y="17" width="2" height="2"/>
      <rect x="-2" y="17" width="2" height="2"/>
    </g>
  </g>
</svg>
