map "$arg_format|$http_accept$http_accepts" $wk_button {
    default                  /buttons/duplexsystem.png;
    "~^json\|"               /.well-known/button.json;
    "~\|.*application/json"  /.well-known/button.json;
}

map $http_accept $jxl_suffix {
    default "";
    "~*image/jxl(?!\s*;\s*q\s*=\s*0(?:\.0*)?\s*(?:[,;]|$))" ".jxl";
}
map $uri $jxl_vary {
    default "";
    "~\.jxl$" "Accept";
}
map $uri $jxl_disposition {
    default "";
    "~/(?<jxl_name>[^/]+)\.[A-Za-z0-9]+\.jxl$" 'inline; filename="$jxl_name.jxl"';
}
