# Local preview. Same site.conf the production vhost includes, so the two
# cannot drift; only the listener, root and logging differ.
#
#   podman run -d --name dxs-nginx --network=host \
#     -v "$PWD/dist-preview:/site:ro,Z" \
#     -v "$PWD/nginx/preview.conf:/etc/nginx/nginx.conf:ro,Z" \
#     -v "$PWD/nginx:/etc/nginx/dxs:ro,Z" \
#     docker.io/fholzer/nginx-brotli:latest

worker_processes 1;
events { worker_connections 64; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;
  sendfile on;

  include /etc/nginx/dxs/maps.conf;

  server {
    listen 8088;
    server_name localhost;
    root /site;

    include /etc/nginx/dxs/site.conf;
  }

  # A dead upstream, so every request 502s and error_page substitutes the
  # portal page while keeping the status. Exercises error-portal.snippet.conf.
  server {
    listen 8089;
    server_name localhost;

    location / { proxy_pass http://127.0.0.1:9; }

    error_page 400 /_eportal/400;
    error_page 401 /_eportal/401;
    error_page 403 /_eportal/403;
    error_page 404 /_eportal/404;
    error_page 413 /_eportal/413;
    error_page 429 /_eportal/429;
    error_page 500 /_eportal/500;
    error_page 502 /_eportal/502;
    error_page 503 /_eportal/503;
    error_page 504 /_eportal/504;
    location ~ ^/_eportal/(?<ecode>\d+)$ {
      internal;
      proxy_pass http://127.0.0.1:8088/errors/$ecode/index.html;
    }
  }
}
