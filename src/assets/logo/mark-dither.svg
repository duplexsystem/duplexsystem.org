<!-- Dithered mark, opposed ramp. Self-colored on the root: page custom
     properties cannot reach inside an <img>. One screen cell is displaySize/32,
     so it only stays crisp at multiples of 32px. Joins must stay bevel; a mitre
     on this barb spikes 15.2 units past the vertex, outside the box. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="duplexsystem" style="color:var(--acc, #b48cff)"><defs><pattern id="s25" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2" height="2" fill="#fff"/><rect x="4" y="2" width="2" height="2" fill="#fff"/><rect x="2" y="4" width="2" height="2" fill="#fff"/><rect x="6" y="6" width="2" height="2" fill="#fff"/></pattern><pattern id="s75" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="2" width="2" height="2" fill="#fff"/><rect x="0" y="4" width="2" height="2" fill="#fff"/><rect x="0" y="6" width="2" height="2" fill="#fff"/><rect x="2" y="0" width="2" height="2" fill="#fff"/><rect x="2" y="2" width="2" height="2" fill="#fff"/><rect x="2" y="6" width="2" height="2" fill="#fff"/><rect x="4" y="0" width="2" height="2" fill="#fff"/><rect x="4" y="4" width="2" height="2" fill="#fff"/><rect x="4" y="6" width="2" height="2" fill="#fff"/><rect x="6" y="0" width="2" height="2" fill="#fff"/><rect x="6" y="2" width="2" height="2" fill="#fff"/><rect x="6" y="4" width="2" height="2" fill="#fff"/></pattern><pattern id="s50" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#fff"/><rect x="2" y="2" width="2" height="2" fill="#fff"/></pattern><mask id="ka"><rect x="0" width="16" height="64" fill="#fff"/><rect x="16" width="16" height="64" fill="url(#s75)"/><rect x="32" width="16" height="64" fill="url(#s50)"/><rect x="48" width="16" height="64" fill="url(#s25)"/></mask><mask id="kb"><rect x="0" width="16" height="64" fill="url(#s25)"/><rect x="16" width="16" height="64" fill="url(#s50)"/><rect x="32" width="16" height="64" fill="url(#s75)"/><rect x="48" width="16" height="64" fill="#fff"/></mask></defs><g mask="url(#ka)" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="bevel"><path d="M42 8 6 26h52"/></g><g mask="url(#kb)" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="bevel"><path d="M22 56 58 38H6"/></g></svg>
